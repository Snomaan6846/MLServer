# Generate requirements/*.txt from config variants and create a PR when files change.
name: Requirements Files Generation

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Base branch to run against (manual runs only)'
        required: true
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-pr:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'opendatahub-io/MLServer' && github.ref_name == 'rhoai-staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || 'rhoai-staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman yq

      - name: Log in to container registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.QUAY_PASSWORD }}
          REGISTRY: ${{ secrets.REGISTRY || 'quay.io' }}
        run: |
          set -euo pipefail
          if [[ -n "${REGISTRY_USERNAME}" && -n "${REGISTRY_PASSWORD}" ]]; then
            echo "$REGISTRY_PASSWORD" | podman login -u "$REGISTRY_USERNAME" --password-stdin "$REGISTRY"
          else
            echo "Registry credentials are not fully set; skipping podman login."
          fi

      - name: Generate pinned requirements
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          script=hack/generate-pinned-requirements.py
          config=hack/requirements-config.json
          jq -r '.variants[] | "\(.name)\t\(.dockerfile)"' "$config" | while IFS=$'\t' read -r name dockerfile; do
            image="$(python "$script" --print-base-image "$dockerfile")"
            echo "Running for variant $name in image $image ..."
            podman run --rm --user 0 \
              -v "$WORKSPACE:$WORKSPACE:z" -w "$WORKSPACE" \
              "$image" python "$script" -o "requirements/requirements-${name}.txt"
          done

      - name: Fix ownership of generated files
        run: |
          sudo chown -R "$USER:$USER" .

      - name: Collect changed requirements metadata
        id: req_meta
        run: |
          set -euo pipefail
          changed_files_count="$(git status --porcelain -- requirements/ | awk 'NF {c++} END {print c+0}')"
          echo "changed_files_count=${changed_files_count}" >> "$GITHUB_OUTPUT"

      - name: Load reviewers from OWNERS file
        id: owners_reviewers
        run: |
          set -euo pipefail
          if [[ ! -f OWNERS ]]; then
            echo "reviewers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reviewers="$(yq -r '.reviewers // [] | join(",")' OWNERS)"
          echo "reviewers=${reviewers}" >> "$GITHUB_OUTPUT"

      - name: Create or Update Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          base: ${{ env.BASE_BRANCH }}
          branch: requirements/regenerate-${{ env.BASE_BRANCH }}
          delete-branch: true
          commit-message: "chore: regenerate pinned requirements from hack/requirements-config.json"
          title: Regenerate pinned requirements
          body: |
            ## Description
            Regenerated `requirements/*.txt` by running the generator inside each base image container (per variant; pip uses each image index).

            ## Changes
            - Updated pinned requirements under `requirements/`
            - Changed files under `requirements/`: ${{ steps.req_meta.outputs.changed_files_count }}

            Triggered by **Actions → Requirements** (manual or every 12 hours).
            🤖 Generated with GitHub Actions
          add-paths: |
            requirements/
          reviewers: ${{ github.repository == 'opendatahub-io/MLServer' && steps.owners_reviewers.outputs.reviewers || '' }}


[tox]
isolated_build = true

[testenv]
allowlist_externals = poetry
commands_pre =
    poetry sync --no-root
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -n auto \
        {toxinidir}/tests

[testenv:cuda]
skip_install = true
allowlist_externals =
    poetry
    bash
passenv =
    CUDA_VISIBLE_DEVICES
    LD_LIBRARY_PATH
    CUDA_HOME
; The dev group pulls onnxruntime (CPU) which conflicts with onnxruntime-gpu
; from the cuda extra — uninstall CPU and force-reinstall GPU to resolve.
commands_pre =
    poetry sync --no-root -E cuda
    bash -c "poetry run pip uninstall -y onnxruntime 2>/dev/null || true"
    bash -c "poetry run pip install --force-reinstall --no-deps \"onnxruntime-gpu==$(poetry run python -c 'import importlib.metadata; print(importlib.metadata.version(\"onnxruntime-gpu\"))')\""
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -m cuda \
        {toxinidir}/tests


[tox]
isolated_build = true

[testenv]
allowlist_externals = poetry
commands_pre =
    poetry sync --no-root
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -n auto \
        {toxinidir}/tests

# GPU test env — uses --extras cuda (onnxruntime-gpu only) because CI GPU
# nodes provide CUDA shared libraries via system RPMs.  For bare-metal dev
# with pip-installed NVIDIA libs, use `make install-dev-cuda` which installs
# the runtimes-cuda Poetry group (includes all nvidia-* pip packages).
[testenv:cuda]
skip_install = true
allowlist_externals = poetry
passenv =
    CUDA_VISIBLE_DEVICES
    LD_LIBRARY_PATH
    CUDA_HOME
commands_pre =
    poetry sync --no-root --extras cuda
    poetry run pip uninstall -y onnxruntime 2>/dev/null || true
    poetry run pip install --force-reinstall --no-deps \
        "onnxruntime-gpu==$(poetry run python -c 'import importlib.metadata; print(importlib.metadata.version(\"onnxruntime-gpu\"))')"
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -m cuda \
        {toxinidir}/tests


[tool.poetry]
name = "mlserver-onnx"
version = "1.7.0.dev0"
description = "ONNX runtime for MLServer"
authors = [
    "Syed Nomaan Ali (Snomaan6846) <nomaan.syed.ali@gmail.com>",
    "Syed Nomaan Ali (Red Hat, Inc.) <syedali@redhat.com>",
]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "mlserver_onnx"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
mlserver = "*"
# >=1.21.0 required for opset 21 support used by onnxruntime >=1.20.0
onnx = ">=1.21.0"
# Upper bound capped to tested range; extend after validating newer ORT against
# both CPU and CUDA execution providers in CI.
onnxruntime = [
    {version = ">=1.20.0,<1.24.0", markers = "python_version < '3.11'"},
    {version = ">=1.20.0,<1.27.0", markers = "python_version >= '3.11'"},
]
# CUDA optional dep — version bounds must stay in sync with onnxruntime above.
# NVIDIA pip libraries (nvidia-cublas-cu12, etc.) are dev-only and live in the
# root pyproject.toml runtimes-cuda group, not here (see AGENTS.md #10).
onnxruntime-gpu = [
    {version = ">=1.20.0,<1.24.0", markers = "python_version < '3.11'", optional = true},
    {version = ">=1.20.0,<1.27.0", markers = "python_version >= '3.11'", optional = true},
]

[tool.poetry.extras]
cuda = ["onnxruntime-gpu"]

[tool.poetry.group.dev.dependencies]
mlserver = {path = "../..", develop = true}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


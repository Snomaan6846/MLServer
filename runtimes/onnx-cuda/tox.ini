[tox]
isolated_build = true

[testenv]
allowlist_externals = poetry
commands_pre =
    poetry sync --no-root
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -n auto -m "not cuda" \
        {toxinidir}/../onnx/tests

[testenv:cuda]
allowlist_externals = poetry
passenv = CUDA_VISIBLE_DEVICES LD_LIBRARY_PATH CUDA_HOME
commands_pre =
    poetry sync --no-root
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -m cuda \
        {toxinidir}/../onnx/tests

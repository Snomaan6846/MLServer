[tox]
isolated_build = true

[testenv]
# poetry-core cannot build when symlinks point outside the project root
# (mlserver_onnx -> ../onnx/mlserver_onnx). skip_install avoids the build;
# PYTHONPATH makes the source importable.
skip_install = true
allowlist_externals = poetry
setenv =
    PYTHONPATH = {toxinidir}/../onnx
commands_pre =
    poetry sync --no-root
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -m "not cuda" -n auto \
        {toxinidir}/tests

[testenv:cuda]
# See the testenv comment above for why skip_install is needed.
skip_install = true
allowlist_externals = poetry
setenv =
    PYTHONPATH = {toxinidir}/../onnx
passenv =
    CUDA_VISIBLE_DEVICES
    LD_LIBRARY_PATH
    CUDA_HOME
commands_pre =
    poetry sync --no-root
    poetry install -C {toxinidir}/../../
commands =
    python -m pytest {posargs} -m cuda \
        {toxinidir}/tests

[tool.poetry]
name = "mlserver-onnx-cuda"
version = "1.7.0.dev0"
description = "ONNX CUDA runtime for MLServer"
authors = [
    "Syed Nomaan Ali (Snomaan6846) <nomaan.syed.ali@gmail.com>",
    "Syed Nomaan Ali (Red Hat, Inc.) <syedali@redhat.com>",
]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "mlserver_onnx_cuda"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
mlserver = "*"
mlserver-onnx = "*"
# Upper bound capped to tested range; extend after validating newer ORT against
# both CPU and CUDA execution providers in CI.
onnxruntime-gpu = [
    {version = ">=1.20.0,<1.24.0", markers = "python_version < '3.11'"},
    {version = ">=1.20.0,<1.27.0", markers = "python_version >= '3.11'"},
]
nvidia-cuda-nvrtc-cu12   = {version = "~=12.0", optional = true}
nvidia-cuda-runtime-cu12 = {version = "~=12.0", optional = true}
nvidia-cublas-cu12       = {version = "~=12.0", optional = true}
nvidia-cufft-cu12        = {version = "~=11.0", optional = true}
nvidia-curand-cu12       = {version = "~=10.0", optional = true}
nvidia-cusolver-cu12     = {version = "~=11.0", optional = true}
nvidia-cusparse-cu12     = {version = "~=12.0", optional = true}
nvidia-nvjitlink-cu12    = {version = "~=12.0", optional = true}
nvidia-cudnn-cu12        = {version = "~=9.0", optional = true}

[tool.poetry.extras]
cuda-libs = [
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-nvjitlink-cu12",
    "nvidia-cudnn-cu12",
]

[tool.poetry.group.dev.dependencies]
mlserver = {path = "../..", develop = true}
mlserver-onnx = {path = "../onnx", develop = true}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

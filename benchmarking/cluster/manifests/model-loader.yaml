apiVersion: v1
kind: Pod
metadata:
  name: model-loader
  namespace: mlserver-perf
  labels:
    app: mlserver-perf
spec:
  restartPolicy: Never
  # Same zone as the T4 node so the WaitForFirstConsumer PVC binds correctly,
  # but no nvidia.com/gpu request (does not consume the GPU).
  nodeSelector:
    nvidia.com/gpu.product: Tesla-T4
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: registry.access.redhat.com/ubi9/ubi:latest
      command: ["/bin/bash", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: models
          mountPath: /mnt/models
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: rfdetr-models

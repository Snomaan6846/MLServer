apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlserver-rfdetr
  namespace: mlserver-perf
  labels:
    app: mlserver-rfdetr
    purpose: rhoaieng-102092
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mlserver-rfdetr
  template:
    metadata:
      labels:
        app: mlserver-rfdetr
        purpose: rhoaieng-102092
    spec:
      nodeSelector:
        nvidia.com/gpu.product: Tesla-T4
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlserver
          image: quay.io/opendatahub/odh-mlserver-cuda@sha256:4c8168e9955daad321eedcd65bbcd27c9f210cfd56f8317f3fa12b10324de3fe
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: rest
              containerPort: 8080
            - name: grpc
              containerPort: 8081
            - name: metrics
              containerPort: 8082
          resources:
            requests:
              cpu: "28"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "28"
              memory: 32Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          volumeMounts:
            - name: models
              mountPath: /mnt/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: rfdetr-models
---
apiVersion: v1
kind: Service
metadata:
  name: mlserver-rfdetr
  namespace: mlserver-perf
  labels:
    app: mlserver-rfdetr
spec:
  type: ClusterIP
  selector:
    app: mlserver-rfdetr
  ports:
    - name: rest
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 8082
      targetPort: 8082
